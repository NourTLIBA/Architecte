<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centre International des Neurosciences — Maquette 3D</title>
<meta name="description" content="Maquette 3D en style AutoCAD du Centre International des Neurosciences : bâtiment R+4, plan masse, énergie et typologies.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app">
  <header id="ribbon">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">Neurosciences — Maquette 3D</span>
    </div>
    <nav id="tabs" role="tablist" aria-label="Panneaux">
      <button role="tab" data-tab="props" aria-selected="true">Accueil</button>
      <button role="tab" data-tab="energy" aria-selected="false">Énergie</button>
      <button role="tab" data-tab="types" aria-selected="false">Typologies</button>
      <button role="tab" data-tab="surf" aria-selected="false">Surfaces</button>
    </nav>
    <div id="tools" role="toolbar" aria-label="Vues">
      <button data-view="iso">ISO SE</button>
      <button data-view="plan">PLAN (HAUT)</button>
      <button data-view="sea">FAÇADE MER</button>
      <button id="explode" aria-pressed="false">ÉCLATÉ</button>
    </div>
  </header>

  <nav id="levels" aria-label="Niveaux"></nav>

  <main id="viewport">
    <canvas id="cross" aria-hidden="true"></canvas>
    <div id="viewcube" aria-label="Cube de navigation"><div class="cube"></div></div>
    <canvas id="ucs" width="96" height="96" aria-hidden="true"></canvas>
    <aside id="cartouche" aria-label="Cartouche">
      <svg class="north" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="22" r="14" fill="none" stroke="currentColor"/><path d="M20 6 L25 26 L20 22 L15 26 Z" fill="currentColor"/><text x="20" y="5" font-size="7" text-anchor="middle" fill="currentColor">N</text></svg>
      <dl>
        <dt>Projet</dt><dd>Centre International des Neurosciences</dd>
        <dt>Plan</dt><dd>Plan masse &amp; maquette 3D</dd>
        <dt>Ind.</dt><dd>A — 01/11/2026</dd>
        <dt>Statut</dt><dd class="warn">Hypothèse de travail — à valider</dd>
      </dl>
    </aside>
  </main>

  <aside id="panel" aria-label="Panneau d'information">
    <button id="sheet-toggle" aria-expanded="false" aria-controls="panel-body">Propriétés</button>
    <div id="panel-body"></div>
  </aside>

  <section id="cmdline" aria-label="Ligne de commande" aria-live="polite"></section>

  <footer id="statusbar">
    <span id="coords">X: 0.000  Y: 0.000  Z: 0.000</span>
    <span id="status-level">SITE</span>
    <span id="status-scale">ÉCHELLE 1:200</span>
    <span class="toggles">
      <button aria-pressed="true" tabindex="-1">GRILLE</button>
      <button aria-pressed="true" tabindex="-1">ORTHO</button>
      <button aria-pressed="false" tabindex="-1">OSNAP</button>
    </span>
  </footer>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
